<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Svenska Yrkesportal — Jobbtorget Scala Pilot</title>
  
  <meta name="description" content="Arbetsinriktad språkutveckling för Jobbtorget Scala, Helsingborgs stad. Ljudfokuserad, tillgänglig och evidensbaserad.">
  <meta name="theme-color" content="#1d4ed8">
  
  <!-- Helsingborgs stad Typografi (Roboto & Helsingborg Sans) -->
    <!-- Helsingborgs stad Officiell Digital Typografi (Roboto & Helsingborg Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=2.7">
</head>
<body>

  <!-- Top Application Header -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <a href="#" class="brand-wrapper" id="brand-home-link" aria-label="Svenska Yrkesportal Hem">
        <img src="assets/helsingborg_logo.svg" alt="Helsingborgs stad vapen" class="brand-crest" width="26" height="26">
        <span class="brand-title">Svenska Yrkesportal</span>
      </a>

      <div class="header-right-controls">
        <a href="../" class="v1-back-btn" title="Tillbaka till tidigare v1-versionen">
          <svg class="m-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span class="v1-label">v1</span>
        </a>
        <!-- Native Language Support Dropdown -->
        <div class="lang-selector-box">
          <button type="button" class="lang-dropdown-btn" id="lang-dropdown-btn" aria-haspopup="true" aria-expanded="false" title="Välj stödspråk">
            <span id="active-lang-label">SV</span>
            <span style="font-size: 0.65rem;">▼</span>
          </button>
          
          <div class="lang-menu hidden" id="lang-menu" role="menu">
            <button type="button" class="lang-item-btn active" data-lang="none" role="menuitem">Endast svenska</button>
            <button type="button" class="lang-item-btn" data-lang="ar" role="menuitem">العربية (Arabiska)</button>
            <button type="button" class="lang-item-btn" data-lang="so" role="menuitem">Soomaali (Somaliska)</button>
            <button type="button" class="lang-item-btn" data-lang="ti" role="menuitem">ትግርኛ (Tigrinja)</button>
            <button type="button" class="lang-item-btn" data-lang="uk" role="menuitem">Українська (Ukrainska)</button>
            <button type="button" class="lang-item-btn" data-lang="en" role="menuitem">English (Engelska)</button>
          </div>
        </div>

        <!-- Coach Access Pill -->
        <button type="button" class="coach-mode-toggle-btn" id="coach-mode-toggle" title="Öppna Språkcoach-portalen">
          <svg class="m-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Coach</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-main" id="main-content" role="main">

    <!-- VIEW 1: DESIGN 1 (CALM & SIMPLE - LEARNER HOME) -->
    <section id="view-learner-home" class="view-panel" aria-labelledby="learner-home-heading">
      <!-- Rendered dynamically by app.js -->
    </section>

    <!-- VIEW 2: DESIGN 2 (REAL-WORLD & IMMERSIVE - LESSON RUNNER) -->
    <section id="view-lesson" class="view-panel hidden" aria-labelledby="lesson-heading">
      <!-- Rendered dynamically by app.js -->
    </section>

    <!-- VIEW 3: DESIGN 3 (COACH DASHBOARD & ANALYTICS) -->
    <section id="view-coach" class="view-panel hidden" aria-labelledby="coach-heading">
      <!-- Rendered dynamically by app.js -->
    </section>

    <!-- VIEW 4: MIN TRÄNING (PROGRESS OVERVIEW) -->
    <section id="view-training" class="view-panel hidden" aria-labelledby="training-heading">
      <!-- Rendered dynamically by app.js -->
    </section>

  </main>

  
  <!-- Coach PIN Gate Modal (Shared-Device Protection) -->
  <div id="coach-pin-modal" class="pin-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="coach-pin-title">
    <div class="pin-modal-card">
      <div class="pin-icon-circle">
        <svg class="m-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h3 id="coach-pin-title" class="pin-modal-title">Språkcoach-portal</h3>
      <p class="pin-modal-desc">
        Skydd för delade enheter. Ange coach-kod för att öppna deltagaröversikten och lektionsrapporter.
      </p>

      <form id="coach-pin-form">
        <div class="pin-input-group">
          <input type="password" id="coach-pin-input" class="pin-input-field" placeholder="KOD (t.ex. SCALA10)" maxlength="12" autocomplete="off">
          <div id="coach-pin-error" class="pin-error-msg hidden">Felaktig kod. Försök igen eller använd SCALA10.</div>
        </div>

        <div class="pin-demo-hint">
          <span class="demo-badge-text">Demo-kod för piloten:</span> <button type="button" class="btn-fill-pin" id="btn-quick-fill-pin">Fyll i SCALA10</button>
        </div>

        <div class="pin-modal-actions">
          <button type="button" class="coach-btn" id="btn-cancel-coach-pin" style="background:#f1f5f9; color:#475569; flex:1;">
            Avbryt
          </button>
          <button type="submit" class="action-btn-primary" id="btn-submit-coach-pin" style="flex:1.5;">
            Öppna portal
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Mobile / Responsive Learner Nav) -->
  <nav class="bottom-nav-bar" id="bottom-nav" role="navigation" aria-label="Mobil huvudmeny">
    <button type="button" class="bottom-nav-item active" data-target-view="home">
      <span class="nav-icon">
        <svg class="m-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span>Hem</span>
    </button>
    <button type="button" class="bottom-nav-item" data-target-view="training">
      <span class="nav-icon">
        <svg class="m-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      </span>
      <span>Min träning</span>
    </button>
    <button type="button" class="bottom-nav-item" data-target-view="coach">
      <span class="nav-icon">
        <svg class="m-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </span>
      <span>Coachläge</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script src="js/audio.js?v=2.7"></script>
  <script src="js/lessons-data.js?v=2.7"></script>
  <script src="js/coach-data.js?v=2.7"></script>
  <script src="js/app.js?v=2.7"></script>

</body>
</html>
